# SonarCloud Project Configuration
sonar.projectKey=Keshavs12_Realtime-video-platform
sonar.organization=keshavs12
sonar.projectName=Realtime-video-platform
sonar.projectVersion=1.0.0

# Paths to source code
sonar.sources=apps/server/src,apps/web/src

# Files to ignore (build output, dependencies, etc.)
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/.turbo/**,apps/server/prisma/**,**/*.test.ts,**/*.spec.ts

# Encoding
sonar.sourceEncoding=UTF-8

# Test coverage paths (for future unit tests)
sonar.javascript.lcov.reportPaths=coverage/lcov.info,apps/web/coverage/lcov.info,apps/server/coverage/lcov.info
